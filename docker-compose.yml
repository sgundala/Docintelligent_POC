version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - doc_uploads:/app/uploads
      - doc_outputs:/app/outputs
      - doc_logs:/app/logs
      - ontology_db:/app/ontology_data
      - ./sample_docs:/app/sample_docs:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  doc_uploads:
  doc_outputs:
  doc_logs:
  ontology_db:
